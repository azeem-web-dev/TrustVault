# TrustVault — https://vault.rayyanazeem.cloud
# TLS lines are added by certbot (`certbot --nginx -d vault.rayyanazeem.cloud`).

limit_req_zone $binary_remote_addr zone=tv_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=tv_api:10m rate=20r/s;

upstream tv_api { server 127.0.0.1:4100; keepalive 16; }
upstream tv_web { server 127.0.0.1:4101; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name vault.rayyanazeem.cloud;

    server_tokens off;
    client_max_body_size 26m;     # 25 MB file cap in the app + multipart overhead
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Overwrite, never append, so a client cannot inject its own
    # X-Forwarded-For and appear to come from a different IP.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location = /api/auth/login {
        limit_req zone=tv_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://tv_api;
    }

    location /api/ {
        limit_req zone=tv_api burst=40 nodelay;
        limit_req_status 429;
        proxy_request_buffering off;   # stream uploads to the API, which enforces the size cap
        proxy_buffering off;           # stream downloads; nothing is cached on disk by nginx
        proxy_read_timeout 120s;
        proxy_pass http://tv_api;
    }

    location / {
        proxy_pass http://tv_web;
    }
}
