# Outside witness for the audit chain (THREATS.md L8).
#
# Every 15 minutes GitHub — not the TrustVault server — fetches the signed
# audit checkpoints from the public witness endpoint, checks that nothing it
# saw before has changed, and commits new checkpoints to the `witness`
# branch. The server holds no credential for this repository, so whoever
# controls the server cannot rewrite what was witnessed. If a check fails,
# nothing is committed and this workflow fails, which emails the owner.
#
# It also checks the server against Sigstore's public transparency log, where
# the server publishes each checkpoint within a minute (tools/anchor.mjs):
# every public entry signed with the audit key must match a checkpoint the
# server still reports (public-log.jsonl records the ones already checked),
# and a checkpoint left unpublished for an hour fails the run.
name: Audit witness

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-witness
  cancel-in-progress: false

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the witness tool (main)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: main
          persist-credentials: false

      - name: Check out the witness log
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: witness
          path: log

      - name: Witness
        # Retry only transient GitHub->server network errors (timeout, 5xx, DNS).
        # A real integrity failure prints "WITNESS ALARM" and must fail at once,
        # loud, so a transient timeout is never mistaken for an audit alarm.
        run: |
          for attempt in 1 2 3; do
            if out=$(node main/tools/witness.mjs --url https://vault.rayyanazeem.cloud --dir log 2>&1); then
              echo "$out"; exit 0
            fi
            echo "$out"
            if echo "$out" | grep -q 'WITNESS ALARM'; then
              echo "integrity alarm — failing immediately, not retrying."; exit 1
            fi
            if echo "$out" | grep -qiE 'aborted|time(d)? ?out|fetch failed|ECONN|ENOTFOUND|EAI_AGAIN|socket hang|answered 5[0-9][0-9]'; then
              echo "transient network error (attempt $attempt/3); retrying in 20s..."; sleep 20; continue
            fi
            echo "non-transient failure — not retrying."; exit 1
          done
          echo "still failing after 3 attempts."; exit 1

      - name: Commit new checkpoints
        working-directory: log
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing new to record."
            exit 0
          fi
          git config user.name "trustvault-witness"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          head=$(tail -n 1 checkpoints.jsonl | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).seq))')
          git add checkpoints.jsonl signing-key.json public-log.jsonl 2>/dev/null || git add checkpoints.jsonl signing-key.json
          git commit -q -m "Witness audit checkpoints up to seq ${head}"
          git push -q origin HEAD:witness
