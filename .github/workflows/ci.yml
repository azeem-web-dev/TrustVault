name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API tests (real Postgres + Redis)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      PUBLIC_ORIGIN: https://vault.test
      DATABASE_URL: postgresql://tv_dev_app:ci-app@127.0.0.1:5432/trustvault_test
      TEST_DATABASE_URL: postgresql://tv_dev_app:ci-app@127.0.0.1:5432/trustvault_test
      TEST_DATABASE_OWNER_URL: postgresql://tv_dev_owner:ci-owner@127.0.0.1:5432/trustvault_test
      REDIS_URL: redis://127.0.0.1:6379
      KEY_PROVIDER: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Create database roles (same layout as production)
        run: PGPASSWORD=ci-superuser psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f infra/ci/setup-db.sql
      - name: Install (no install scripts except the approved ones)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild prisma @prisma/engines esbuild
      - name: Generate a throwaway master key for the local key provider
        run: echo "LOCAL_MASTER_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Type-check
        run: |
          cd apps/api && npx prisma generate && npx tsc --noEmit -p tsconfig.json
          cd ../web && npx tsc --noEmit
      - name: Tests
        run: cd apps/api && npx vitest run
      - name: Offline audit verifier (forged chains, wrong keys, cut-off tails)
        run: node tools/verify-audit.test.mjs
      - name: Offline key-ledger reconciliation (forged, rewritten and truncated ledgers)
        run: node tools/reconcile-ledger.test.mjs
      - name: Independent Python verifier agrees with the Node verifier (docs/VERIFY.md)
        run: node tools/independent-verify/agreement.test.mjs
      - name: Build web
        run: cd apps/web && npx next build
      - name: Browser tests (passkeys; stored XSS, CSP, framing and headers on the production build)
        env:
          CHROME_PATH: /usr/bin/google-chrome
          E2E_SKIP_BUILD: '1'
        run: cd apps/api && npm run test:e2e

  mutation:
    # 204 rows, each a separate test run: split across 8 machines in parallel.
    # The full committed report comes from a local `node tools/mutation-check.mjs`.
    name: Mutation check ${{ matrix.shard }}/8 (remove each authorisation rule; tests must fail)
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      PUBLIC_ORIGIN: https://vault.test
      DATABASE_URL: postgresql://tv_dev_app:ci-app@127.0.0.1:5432/trustvault_test
      TEST_DATABASE_URL: postgresql://tv_dev_app:ci-app@127.0.0.1:5432/trustvault_test
      TEST_DATABASE_OWNER_URL: postgresql://tv_dev_owner:ci-owner@127.0.0.1:5432/trustvault_test
      REDIS_URL: redis://127.0.0.1:6379
      KEY_PROVIDER: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Create database roles (same layout as production)
        run: PGPASSWORD=ci-superuser psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f infra/ci/setup-db.sql
      - name: Install (no install scripts except the approved ones)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild prisma @prisma/engines esbuild
      - name: Generate a throwaway master key for the local key provider
        run: echo "LOCAL_MASTER_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Generate Prisma client
        run: cd apps/api && npx prisma generate
      - name: Mutations in this shard
        run: node tools/mutation-check.mjs --shard ${{ matrix.shard }}/8

  mobile:
    name: Android app (analyze, unit/widget tests, static security check)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Dependencies (exactly as locked)
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests (fake API, no network)
        run: flutter test
      - name: Static Android security check (manifests, backup rules, Gradle)
        run: dart run tool/android_security_check.dart
      - name: Release build and merged-manifest check
        if: github.event_name == 'push'
        run: |
          flutter build apk --release
          dart run tool/android_security_check.dart --merged

  keyd:
    name: keyd (Rust) tests, locked
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 1.91.1 is the toolchain install-keyd.sh uses on the server.
      - uses: dtolnay/rust-toolchain@8632757d5a758c452f724e9d837848c694a7bb48 # 1.91.1
        with:
          components: clippy
      # Any clippy warning fails the build.
      - run: cd keyd && cargo clippy --locked --all-targets -- -D warnings
      # --locked: fail if Cargo.lock is missing or out of date, so CI builds
      # exactly the dependency versions that were reviewed.
      - run: cd keyd && cargo test --release --locked
      - run: cd keyd && cargo build --release --locked

  keyd-reproducible:
    name: keyd builds bit-for-bit twice
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@8632757d5a758c452f724e9d837848c694a7bb48 # 1.91.1
      - name: Build twice in different directories and compare SHA-256
        run: bash tools/repro-check-keyd.sh

  audit:
    name: Dependency vulnerabilities (npm, Cargo, pub)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: npm audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high
      # OSV-Scanner reads all three lockfiles (npm, Cargo, pub) and fails on
      # ANY known vulnerability that is not in osv-scanner.toml. Every entry
      # there needs a reason and an expiry date.
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=package-lock.json
            --lockfile=keyd/Cargo.lock
            --lockfile=apps/mobile/pubspec.lock
      # Second opinion straight from the RustSec advisory database.
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-audit@0.22.2
      - name: cargo audit
        run: cd keyd && cargo audit --deny warnings --file Cargo.lock

  sbom:
    name: SBOMs (CycloneDX)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@8632757d5a758c452f724e9d837848c694a7bb48 # 1.91.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-cyclonedx@0.5.9
      - name: Generate
        run: |
          mkdir sbom
          npm ci --ignore-scripts --no-audit --no-fund
          npm sbom --sbom-format cyclonedx --omit dev --package-lock-only > sbom/npm.cdx.json
          (cd keyd && cargo cyclonedx --format json --override-filename tvkeyd.cdx)
          mv keyd/tvkeyd.cdx.json sbom/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          retention-days: 90

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
