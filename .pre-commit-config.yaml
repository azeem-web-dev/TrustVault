# Optional local pre-commit hooks (docs/SUPPLY_CHAIN.md). CI runs the same
# secret scan on every push, so this only catches a secret before it is
# committed. Install: pipx install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks
