[package]
name = "tvkeyd"
version = "0.1.0"
edition = "2021"
description = "TrustVault key service: holds the master keys, unwraps data keys only against database-issued tickets, keeps a signed key-use ledger and signs audit checkpoints over a Unix socket"
license = "MIT"
publish = false

[dependencies]
aes-gcm = "0.11"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
ed25519-dalek = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2"
zeroize = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
